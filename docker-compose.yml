version: "3.9"

services:
  db:
    image: postgres:15
    container_name: compta_db
    restart: always
    environment:
      POSTGRES_USER: Thanystos
      POSTGRES_PASSWORD: Devilplop0
      POSTGRES_DB: compta_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: compta_backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://Thanystos:Devilplop0@db:5432/compta_db
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  alembic:
    build: ./backend
    container_name: compta_alembic
    depends_on:
      - db
    command: >
      bash -c "alembic upgrade head"
    environment:
      DATABASE_URL: postgresql://anthony:anthony_password@db:5432/compta_db
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: compta_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:8000

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
